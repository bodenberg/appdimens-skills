<!doctype html>
<!-- Responsive login page. Designed and QA'd at 375×667 (iPhone SE). Mobile-first; tablet centers a card. -->
<!-- AppDimens: webdimens 3.2.1 · strategy auto (formFactors phone + tablet) · base screen 375×667 CSS px (assumed, unconfirmed) · match-base (asdp ×1.25).
     Tokens = value on 375 ÷ 1.25. Font sizes exact (0.01), layout rounded to 0.5. Line heights are unitless ratios of the font size. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../node_modules/webdimens/dist/webdimens.global.js"></script>
<style data-webdimens>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,Arial,sans-serif;background:#fff;color:#111827}
.wrap{
  padding:25.5asdp 16asdp;
  display:flex;flex-direction:column;
  gap:16asdp;
  min-height:100vh; /* ad:fixed fraction: full window height */
}
.logo{
  width:51asdp;
  height:51asdp;
  border-radius:13asdp;
  background:linear-gradient(135deg,#34D399,#059669)
}
h1{font-size:22.4assp;line-height:1.2143;font-weight:700}
.sub{font-size:12assp;line-height:1.4667;color:#6B7280;margin-top:-9.5asdp}
form{display:flex;flex-direction:column;gap:9.5asdp}
label{font-size:10.4assp;line-height:1.3846;font-weight:600}
input{
  height:38.5asdp;
  border:1px solid #D1D5DB; /* ad:fixed hairline */
  border-radius:8asdp;
  padding:0 11asdp;
  font-size:12.8assp;
  width:100%
}
.btn{
  height:41.5asdp;
  border:0;
  border-radius:9.5asdp;
  background:#059669;color:#fff;
  font-size:12.8assp;font-weight:600;
  margin-top:6.5asdp
}
.link{font-size:11.2assp;line-height:1.4286;color:#059669;text-align:center}
.social{display:grid;grid-template-columns:1fr 1fr;gap:9.5asdp}
.social button{
  height:35asdp;
  border:1px solid #D1D5DB; /* ad:fixed hairline */
  border-radius:8asdp;
  background:#fff;
  font-size:11.2assp
}
/* Touch targets: the visual size scales (never clamped); the hit area is a fixed minimum overlay. */
button{position:relative}
button::before{content:"";position:absolute;left:0;right:0;top:50%;height:100%;transform:translateY(-50%)}
button::before{min-height:44px} /* ad:fixed touch-min */
footer{font-size:10.4assp;line-height:1.3846;color:#6B7280;text-align:center;margin-top:auto}
/* adapt @ min-width 768 (existing breakpoint, structural): centered card on a grey canvas.
   The card scales with the same strategy as its content (decision-table rule 20c), so the
   card/content proportions authored for the tablet are preserved: 440 → 352asdp, 40 → 32asdp,
   32 → 25.5asdp, 20 → 16asdp (normalized on the 375 base like the content they wrap). */
@media (min-width:768px){
  body{background:#F3F4F6}
  .wrap{
    max-width:352asdp;
    margin:32asdp auto;
    min-height:auto;
    background:#fff;
    border-radius:16asdp;
    box-shadow:0 8px 24px rgba(0,0,0,.08); /* ad:fixed shadow */
    padding:32asdp 25.5asdp
  }
}
</style></head><body>
<div class="wrap">
  <div class="logo" data-k="logo"></div>
  <h1 data-k="title">Welcome back</h1>
  <p class="sub" data-k="sub">Sign in to continue to your account</p>
  <form>
    <label data-k="label">Email</label><input data-k="input" placeholder="you@email.com">
    <label>Password</label><input type="password" placeholder="••••••••">
    <button class="btn" type="button" data-k="button">Sign in</button>
  </form>
  <a class="link" data-k="link">Forgot your password?</a>
  <div class="social"><button data-k="social">Google</button><button>Apple</button></div>
  <footer data-k="footer">By continuing you agree to our Terms</footer>
</div>
</body></html>
