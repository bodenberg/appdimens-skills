<!doctype html>
<!-- Profile screen — implemented from Claude Design "Profile" (iPhone 14 frame 390×844, prototype chrome removed).
     Base screen: 390×844 CSS px (app area 390×797 without the 47px fake status bar) · portrait · font 1.0
     (assumed, unconfirmed) · strategy auto (formFactors phone + tablet) · match-base · asdp/assp ×1.300 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile</title>
<script src="../node_modules/webdimens/dist/webdimens.global.js"></script>
<style data-webdimens>
  /* Theme tokens: exact base values (cli normalize --theme), named by the design value on the 390 base screen */
  :root {
    --space-4: 3.08asdp;    /* 4px  */
    --space-8: 6.15asdp;    /* 8px  */
    --space-12: 9.23asdp;   /* 12px */
    --space-16: 12.31asdp;  /* 16px */
    --space-24: 18.46asdp;  /* 24px */
    --radius-6: 4.62asdp;   /* 6px  */
    --radius-12: 9.23asdp;  /* 12px */
    --radius-16: 12.31asdp; /* 16px */
    --text-14: 10.77assp;   /* 14px */
    --text-16: 12.31assp;   /* 16px */
    --text-18: 13.85assp;   /* 18px */
    --text-20: 15.38assp;   /* 20px (name: clamp(20px,5vw,24px) resolved on the base frame) */
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html { background: #F9FAFB; }
  body {
    min-height: 100dvh;
    background: #F9FAFB;
    color: #000;
    font-family: Inter, Arial, sans-serif;
    font-size: var(--text-16);
  }

  /* screen: stack-v, fill width, page scrolls (scroll-v) */
  .screen {
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    padding-top: calc(var(--space-8) + env(safe-area-inset-top));          /* ad:fixed safe-area inset */
    padding-inline: calc(var(--space-16) + env(safe-area-inset-left)) calc(var(--space-16) + env(safe-area-inset-right));
    padding-bottom: env(safe-area-inset-bottom);                          /* ad:fixed safe-area inset */
  }

  .card {
    background: #fff;
    border: 1px solid #E5E7EB; /* ad:fixed hairline */
    border-radius: var(--radius-16);
  }

  /* header card: stack-v centred */
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-16);
  }
  .avatar {
    width: 61.5asdp;   /* 80px */
    height: 61.5asdp;  /* 80px */
    border-radius: 50%;
    background: linear-gradient(135deg, #818CF8, #6366F1);
  }
  .name {
    margin-top: var(--space-24);
    font-size: var(--text-20);
    line-height: 1.3;
    font-weight: 700;
  }
  .email { margin-top: var(--space-4); }

  .text-sm   { font-size: var(--text-14); line-height: 1.4286; } /* 14/20 */
  .text-base { font-size: var(--text-16); line-height: 1.5; }    /* 16/24 */
  .text-lg   { font-size: var(--text-18); line-height: 1.5556; } /* 18/28 */
  .text-gray { color: #6B7280; }

  /* stats: grid, 3 fixed columns (count does not scale) */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: var(--space-16);
  }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat-value { font-weight: 700; }

  /* settings list */
  .list { list-style: none; padding: 0; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-16);
    cursor: pointer;
  }
  .row:not(:last-child) { border-bottom: 1px solid #F3F4F6; } /* ad:fixed hairline */
  .row-main { display: flex; align-items: center; gap: var(--space-12); }
  .row-icon {
    flex: none;
    width: 18.5asdp;   /* 24px */
    height: 18.5asdp;  /* 24px */
    border-radius: var(--radius-6);
    background: #C7D2FE;
  }

  .button {
    width: 100%;
    height: 37asdp;    /* 48px */
    border: 0;
    border-radius: var(--radius-12);
    background: #4F46E5;
    color: #fff;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .button:focus-visible, .row:focus-visible { outline: 2px solid #4F46E5; outline-offset: 2px; } /* ad:fixed focus ring */
</style>
</head>
<body>
  <main class="screen">
    <section class="card header" data-k="header">
      <div class="avatar" data-k="avatar" role="img" aria-label="Ana Souza"></div>
      <h1 class="name" data-k="name">Ana Souza</h1>
      <p class="email text-sm text-gray" data-k="email">ana.souza@email.com</p>
    </section>

    <section class="card stats" data-k="stats">
      <div class="stat"><span class="stat-value text-lg" data-k="statvalue">128</span><span class="text-sm text-gray">Orders</span></div>
      <div class="stat"><span class="stat-value text-lg">24</span><span class="text-sm text-gray">Reviews</span></div>
      <div class="stat"><span class="stat-value text-lg">5</span><span class="text-sm text-gray">Coupons</span></div>
    </section>

    <ul class="card list" data-k="list">
      <li class="row" tabindex="0" data-k="row"><span class="row-main"><span class="row-icon" data-k="rowicon"></span><span class="text-base" data-k="rowlabel">Personal info</span></span><span class="text-gray" aria-hidden="true">›</span></li>
      <li class="row" tabindex="0"><span class="row-main"><span class="row-icon"></span><span class="text-base">Payment methods</span></span><span class="text-gray" aria-hidden="true">›</span></li>
      <li class="row" tabindex="0"><span class="row-main"><span class="row-icon"></span><span class="text-base">Notifications</span></span><span class="text-gray" aria-hidden="true">›</span></li>
      <li class="row" tabindex="0"><span class="row-main"><span class="row-icon"></span><span class="text-base">Privacy</span></span><span class="text-gray" aria-hidden="true">›</span></li>
    </ul>

    <button class="button text-base" type="button" data-k="button">Edit profile</button>
  </main>
</body>
</html>
