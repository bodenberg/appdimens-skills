<!doctype html>
<!-- Claude Design export — "Profile" screen, mobile app prototype (iPhone 14 frame) -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* tailwind-like utilities used by the prototype (Tailwind v3 default scale) */
*{box-sizing:border-box;margin:0}
body{font-family:Inter,Arial,sans-serif;background:#E5E7EB;display:flex;justify-content:center}
.phone-frame{width:390px;height:844px;background:#F9FAFB;position:relative;overflow:hidden}
.status-bar{height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:15px;font-weight:600}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111}
.p-4{padding:1rem}.px-4{padding-left:1rem;padding-right:1rem}.pt-2{padding-top:.5rem}.mt-1{margin-top:.25rem}.mt-6{margin-top:1.5rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}.grid-3{display:grid;grid-template-columns:repeat(3,1fr)}
.rounded-xl{border-radius:.75rem}.rounded-2xl{border-radius:1rem}.rounded-full{border-radius:9999px}
.text-sm{font-size:.875rem;line-height:1.25rem}.text-base{font-size:1rem;line-height:1.5rem}.text-lg{font-size:1.125rem;line-height:1.75rem}
.font-semibold{font-weight:600}.font-bold{font-weight:700}.text-gray{color:#6B7280}
.bg-white{background:#fff}.border{border:1px solid #E5E7EB}.w-full{width:100%}.h-12{height:3rem}
.avatar{width:80px;height:80px;background:linear-gradient(135deg,#818CF8,#6366F1)}
.name{font-size:clamp(20px,5vw,24px);line-height:1.3;font-weight:700}
.icon{width:24px;height:24px;border-radius:6px;background:#C7D2FE}
.btn{background:#4F46E5;color:#fff;font-weight:600}
</style></head><body>
<div class="phone-frame">
  <div class="status-bar"><span>9:41</span><span>●●● ▲ ▮</span></div>
  <main class="px-4 pt-2 flex flex-col gap-4">
    <section class="flex flex-col items-center p-4 bg-white rounded-2xl border" data-k="header">
      <div class="avatar rounded-full" data-k="avatar"></div>
      <h1 class="name mt-6" data-k="name">Ana Souza</h1>
      <p class="text-sm text-gray mt-1" data-k="email">ana.souza@email.com</p>
    </section>
    <section class="grid-3 bg-white rounded-2xl border p-4" data-k="stats">
      <!-- {stats.map(s => <Stat/>)} -->
      <div class="flex flex-col items-center"><span class="text-lg font-bold" data-k="statvalue">128</span><span class="text-sm text-gray">Orders</span></div>
      <div class="flex flex-col items-center"><span class="text-lg font-bold">24</span><span class="text-sm text-gray">Reviews</span></div>
      <div class="flex flex-col items-center"><span class="text-lg font-bold">5</span><span class="text-sm text-gray">Coupons</span></div>
    </section>
    <ul class="bg-white rounded-2xl border" style="list-style:none;padding:0" data-k="list">
      <!-- {settings.map(item => <SettingRow/>)} -->
      <li class="flex items-center justify-between p-4" style="border-bottom:1px solid #F3F4F6" data-k="row"><span class="flex items-center gap-3"><span class="icon" data-k="rowicon"></span><span class="text-base" data-k="rowlabel">Personal info</span></span><span class="text-gray">›</span></li>
      <li class="flex items-center justify-between p-4" style="border-bottom:1px solid #F3F4F6"><span class="flex items-center gap-3"><span class="icon"></span><span class="text-base">Payment methods</span></span><span class="text-gray">›</span></li>
      <li class="flex items-center justify-between p-4" style="border-bottom:1px solid #F3F4F6"><span class="flex items-center gap-3"><span class="icon"></span><span class="text-base">Notifications</span></span><span class="text-gray">›</span></li>
      <li class="flex items-center justify-between p-4"><span class="flex items-center gap-3"><span class="icon"></span><span class="text-base">Privacy</span></span><span class="text-gray">›</span></li>
    </ul>
    <button class="btn w-full h-12 rounded-xl text-base" style="border:0" data-k="button">Edit profile</button>
  </main>
  <div class="home-indicator"></div>
</div>
</body></html>
