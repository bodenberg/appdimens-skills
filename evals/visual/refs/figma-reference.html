<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=412">
<!-- Reference render of the Figma frame "Home — Android Compact" (412×917), exactly as the designer sees it. -->
<style>
*{box-sizing:border-box;margin:0}body{font-family:Inter,Arial,sans-serif;background:#fff;color:#111827;width:412px;height:917px;position:relative;overflow:hidden}
.screen{display:flex;flex-direction:column;gap:16px;padding:24px 16px 0}
.header{display:flex;justify-content:space-between;align-items:center}
.title{font-size:24px;font-weight:700;line-height:32px}.avatar{width:40px;height:40px;border-radius:50%;background:#C7D2FE}
.search{height:48px;border-radius:12px;background:#F3F4F6;padding:0 16px;display:flex;align-items:center;font-size:16px;line-height:24px;color:#6B7280}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 16px;border-radius:999px;box-shadow:inset 0 0 0 1px #E5E7EB;font-size:14px;line-height:20px}.chip.sel{background:#111827;color:#fff;box-shadow:none;font-weight:600}
.section{font-size:18px;font-weight:600;line-height:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;box-shadow:inset 0 0 0 1px #E5E7EB}
.img{aspect-ratio:4/3;border-radius:8px}.ct{font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{font-size:14px;line-height:20px;font-weight:700}
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;border-top:1px solid #E5E7EB;background:#fff;display:flex;justify-content:space-around;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:16px;color:#6B7280}.icon{width:24px;height:24px;border-radius:6px;background:#9CA3AF}
</style></head><body>
<div class="screen">
  <div class="header"><div class="title" data-k="title">Discover</div><div class="avatar" data-k="avatar"></div></div>
  <div class="search" data-k="search">Search products</div>
  <div class="chips"><span class="chip sel" data-k="chip">All</span><span class="chip">Shoes</span><span class="chip">Bags</span><span class="chip">Watches</span></div>
  <div class="section" data-k="section">Popular now</div>
  <div class="grid">
    <div class="card" data-k="card"><div class="img" data-k="cardimg" style="background:linear-gradient(135deg,#FDE68A,#F59E0B)"></div><div class="ct" data-k="cardtitle">Running Sneaker Pro</div><div class="price" data-k="price">$129</div></div>
    <div class="card"><div class="img" style="background:linear-gradient(135deg,#A7F3D0,#10B981)"></div><div class="ct">Leather Tote Bag</div><div class="price">$89</div></div>
    <div class="card"><div class="img" style="background:linear-gradient(135deg,#BFDBFE,#3B82F6)"></div><div class="ct">Classic Watch</div><div class="price">$249</div></div>
    <div class="card"><div class="img" style="background:linear-gradient(135deg,#FBCFE8,#EC4899)"></div><div class="ct">Trail Backpack</div><div class="price">$110</div></div>
  </div>
</div>
<nav class="nav" data-k="nav"><div class="tab"><div class="icon" data-k="navicon"></div>Home</div><div class="tab"><div class="icon"></div>Search</div><div class="tab"><div class="icon"></div>Cart</div><div class="tab"><div class="icon"></div>Profile</div></nav>
</body></html>
